<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Design Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141B34;--ink2:#232B52;--coral:#FF6B4A;--sun:#FFC94D;--teal:#2EC4B6;--blue:#4D7CFE;--purple:#9B5DE5;--light:#F4F6FB;--muted:#6B7194;--white:#fff;--ok:#1FA88F;--bad:#E5484D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--white);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 40px;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.brand{font-weight:800;font-size:14px;letter-spacing:.5px;color:var(--sun)}
.pts{background:var(--ink2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.pts b{color:var(--sun)}
h1{font-size:30px;line-height:1.15;margin:8px 0 10px;font-weight:800}
h2{font-size:22px;line-height:1.25;margin:6px 0 8px;font-weight:800}
p{line-height:1.5;margin:6px 0 12px;color:#D7DAE8;font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:1.5px;padding:5px 10px;border-radius:999px;color:var(--ink)}
.card{background:var(--white);color:var(--ink);border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.card p{color:var(--muted)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input[type=text],select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:2px solid #D7DAE8;background:#fff;color:var(--ink);outline:none}
input[type=text]:focus,select:focus{border-color:var(--blue)}
.btn{display:block;width:100%;border:0;font:inherit;font-weight:800;font-size:17px;padding:16px;border-radius:14px;cursor:pointer;margin-top:14px;background:var(--coral);color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--white);border:2px solid #4A5280}
.btn.teal{background:var(--teal)}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px;margin-top:6px}
.dots{position:relative;height:150px;margin:6px 0 4px}
.dots span{position:absolute;border-radius:50%}
/* map */
.path{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.node{display:flex;align-items:center;gap:14px;background:var(--ink2);border-radius:16px;padding:14px;border:2px solid transparent}
.node.cur{border-color:var(--sun);box-shadow:0 0 0 4px rgba(255,201,77,.15)}
.node.lock{opacity:.45}
.badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:0 0 48px;color:var(--ink);font-weight:800}
.node .t{font-weight:800;font-size:16px}
.node .s{font-size:13px;color:#B8BDD6}
.node .r{margin-left:auto;font-weight:800;font-size:13px;color:var(--teal);white-space:nowrap}
/* sliders */
.dash-row{margin:14px 0}
.dash-row .h{display:flex;justify-content:space-between;font-weight:700}
.dash-row .h span{color:var(--muted);font-weight:600;font-size:13px}
input[type=range]{width:100%;accent-color:var(--blue);height:28px}
.bar{height:14px;border-radius:7px;background:var(--light);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:7px;transition:width .2s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid #D7DAE8;background:#fff;color:var(--ink);border-radius:999px;padding:9px 13px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* quiz */
.timer{height:8px;border-radius:4px;background:var(--ink2);overflow:hidden;margin:8px 0 14px}
.timer i{display:block;height:100%;background:var(--sun);width:100%}
.qcount{font-size:13px;font-weight:700;color:#B8BDD6}
.stmt{font-size:21px;font-weight:800;line-height:1.35;min-height:90px;display:flex;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice{border:0;font:inherit;font-weight:800;font-size:16px;padding:18px 10px;border-radius:14px;cursor:pointer;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;border:2px solid #D7DAE8;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:15px;line-height:1.4;padding:14px;border-radius:14px;margin-top:10px;cursor:pointer}
.opt.right,.choice.right{background:#D7F5EF;border-color:var(--ok)}
.opt.wrong,.choice.wrong{background:#FDE2E3;border-color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45;font-weight:600}
.fb.ok{background:#D7F5EF;color:#0F5E52}.fb.no{background:#FDE2E3;color:#8A1F23}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:800;color:var(--sun);pointer-events:none;animation:pop .9s ease forwards;text-shadow:0 4px 18px rgba(0,0,0,.4);z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.plan{border-radius:14px;padding:14px;margin-top:12px;background:var(--light)}
.plan .pl{font-weight:800;font-size:13px;letter-spacing:1px}
.plan .ps{font-size:13px;color:var(--muted);margin:2px 0 8px}
.stars{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.stars button{border:0;background:none;font-size:24px;padding:0 2px;cursor:pointer;line-height:1;color:#D7DAE8}
.stars button.on{color:var(--sun)}
.quote{background:var(--light);border-radius:14px;padding:14px;font-weight:700;line-height:1.5;margin-top:12px}
.scene{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--coral)}
.big{font-size:56px;font-weight:800;color:var(--sun);line-height:1;margin:10px 0}
.rowstat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #E6E8F2;font-weight:700}
.rowstat:last-child{border:0}
#certimg{width:100%;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);margin-top:10px}
.small{font-size:12px;color:#B8BDD6;line-height:1.5}
.fade{animation:fade .35s ease}
.char-cv{image-rendering:pixelated;display:block}
#buddy{display:inline-flex;align-items:flex-end;height:52px;margin-right:6px}
.brandwrap{display:flex;align-items:center}
.hero{display:flex;justify-content:center;margin:2px 0 6px}
.pick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.pick{background:var(--light);border:3px solid transparent;border-radius:12px;padding:6px 0 4px;cursor:pointer;display:flex;justify-content:center}
.pick.on{border-color:var(--coral);background:#FFE7E1}
.pick img{image-rendering:pixelated;width:44px;height:66px}
.pickname{text-align:center;font-weight:800;color:var(--ink);margin-top:4px}
#splash{position:fixed;inset:0;background:var(--ink);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .nn{width:min(72vw,300px);height:auto}
.sp-term{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--teal);margin-top:26px;min-height:18px;white-space:pre}
.sp-term .cur{display:inline-block;width:8px;height:15px;background:var(--coral);vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sp-title{font-weight:800;font-size:26px;letter-spacing:.5px;margin-top:10px;opacity:0;transform:translateY(8px);transition:all .6s ease}
.sp-sub{color:#B8BDD6;font-size:14px;margin-top:4px;opacity:0;transition:opacity .6s ease .2s}
.sp-show{opacity:1!important;transform:none!important}
.logo-wrap{display:flex;justify-content:center;margin:4px 0 2px}
.logo-wrap .nn{width:170px;height:170px}
.lockmsg{background:var(--ink2);border:2px dashed #4A5280;border-radius:14px;padding:14px;margin-top:14px;text-align:center;font-weight:700;line-height:1.5}
.lockmsg small{display:block;color:#B8BDD6;font-weight:600;margin-top:4px}
.stagepill{display:inline-block;background:var(--ink2);color:var(--teal);font-weight:800;font-size:12px;padding:5px 10px;border-radius:99px;margin-bottom:6px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="logo.js"></script>
<script src="chars.js"></script>
<script src="config.js"></script>
<script>
const CFG = Object.assign({SCRIPT_URL:"",EVENT:"Career Development",SESSION:"Your Future, Your Plan",DATE:"",SPEAKER:"Desi Susanti, S.Kom., M.Kom.",SPEAKER_ROLE:"Narasumber"}, window.LDQ_CONFIG||{});
const COL = {ink:"#141B34",ink2:"#232B52",coral:"#FF6B4A",sun:"#FFC94D",teal:"#2EC4B6",blue:"#4D7CFE",purple:"#9B5DE5",muted:"#6B7194",light:"#F4F6FB"};
const KEY = "ldq_v1";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

// ---------------- DATA ----------------
const LEVELS = [
  {id:"l1", n:1, t:"Cek Baterai Hidup", s:"Isi dashboard Health, Work, Play, Love", c:COL.coral, ic:"🔋"},
  {id:"l2", n:2, t:"Gravitasi atau Bukan?", s:"Tebak cepat, 10 kartu", c:COL.sun, ic:"🌍"},
  {id:"l3", n:3, t:"Reframe Rush", s:"Ganti keyakinan yang bikin macet", c:COL.teal, ic:"🔄"},
  {id:"l4", n:4, t:"Rakit Kompasmu", s:"Workview + Lifeview", c:COL.blue, ic:"🧭"},
  {id:"l5", n:5, t:"Odyssey Builder", s:"Tiga versi hidupmu 5 tahun lagi", c:COL.purple, ic:"🚀"},
  {id:"boss", n:6, t:"Boss: Selamatkan Salsa!", s:"Cerita bercabang, pilih langkahnya", c:COL.coral, ic:"👑"},
];
const GRAV = [
  ["Banyak lowongan kerja meminta pengalaman kerja.","G","Ini kenyataan pasar kerja. Yang bisa diatasi: cara kamu mendapat pengalaman sebelum lulus."],
  ["Lulusan ekonomi setiap tahun jumlahnya banyak, persaingan ketat.","G","Kamu tidak bisa mengurangi jumlah lulusan. Fokus pada apa yang membuatmu berbeda."],
  ["Gaji awal fresh graduate umumnya lebih rendah dari gaji karyawan senior.","G","Wajar dan berlaku di hampir semua tempat. Terima, lalu rancang pertumbuhanmu."],
  ["Teknologi dan AI terus mengubah banyak pekerjaan.","G","Arus ini tidak bisa dilawan. Yang bisa: belajar memakai AI sebagai alat."],
  ["Rekruter hanya membaca CV dalam waktu singkat.","G","Itu kebiasaan rekruter. Yang bisa diatasi: membuat CV yang jelas dan ringkas."],
  ["Saya belum pernah magang sama sekali.","A","Bisa diatasi: magang singkat, proyek, kepanitiaan, atau bantu usaha keluarga."],
  ["CV saya masih kosong dan berantakan.","A","Bisa diatasi: minta review alumni, isi dengan pengalaman organisasi dan proyek."],
  ["Saya tidak kenal siapa pun yang bekerja di bank.","A","Bisa diatasi: hubungi alumni lewat LinkedIn untuk percakapan prototipe."],
  ["Saya belum bisa Excel tingkat lanjut.","A","Bisa diatasi: banyak kursus gratis, latihan 30 menit sehari cukup untuk mulai."],
  ["Saya selalu gugup saat wawancara.","A","Bisa diatasi: latihan wawancara bersama teman atau di career center kampus."],
];
const REFRAMES = [
  ["“Saya kuliah akuntansi, jadi harus jadi akuntan.”",["Jurusan adalah titik awal. Ada banyak jalan yang bisa saya coba.","Berarti saya salah jurusan kalau tidak jadi akuntan.","Ikuti saja apa kata orang lain."]],
  ["“Saya harus menemukan passion dulu baru bergerak.”",["Passion muncul setelah mencoba. Saya mulai bergerak dulu.","Tunggu sampai inspirasi datang sendiri.","Passion tidak penting, yang penting gaji besar."]],
  ["“Semester segini harusnya saya sudah tahu tujuan hidup.”",["Saya bisa tahu apakah arah saya benar, sambil terus mencari.","Saya sudah tertinggal jauh dari teman-teman.","Pura-pura saja sudah tahu supaya aman."]],
  ["“Saya harus memilih pekerjaan yang paling sempurna.”",["Tidak ada yang sempurna. Pilih yang baik, lalu jalani sepenuhnya.","Tunda memilih sampai benar-benar yakin 100%.","Lamar semua lowongan, nanti lihat saja hasilnya."]],
  ["“Saya pernah gagal, berarti saya tidak berbakat.”",["Kegagalan itu data. Apa yang bisa saya pelajari darinya?","Lebih baik berhenti mencoba daripada malu lagi.","Itu salah keadaan, bukan urusan saya."]],
];
const WORKV = ["Mandiri finansial","Bermanfaat bagi orang lain","Belajar & berkembang","Berkreasi","Hidup stabil & aman","Memimpin","Bertualang","Membanggakan keluarga"];
const LIFEV = ["keluarga","iman","persahabatan","kesehatan","kebebasan","kontribusi sosial","prestasi","kedamaian"];
const BOSS = [
  {sc:"Babak 1", txt:"Salsa (Manajemen, semester 7) sudah melamar 40 kali dan belum ada panggilan. Ia bilang: “Mungkin aku memang tidak berbakat. Aku les CPNS saja deh, walau sebenarnya tidak tertarik.” Apa saran pertamamu?",
   o:[["Coba kita pilah dulu: mana yang masalah gravitasi, mana yang bisa diatasi?",100,"Tepat! Memilah masalah adalah langkah pertama seorang desainer."],["Ya sudah, ikut les CPNS saja daripada pusing.",20,"Menyerah pada pilihan yang tidak diinginkan biasanya bukan solusi jangka panjang."],["Kirim 100 lamaran lagi, pasti ada yang nyangkut.",40,"Lebih banyak dari cara yang sama jarang memberi hasil berbeda."]]},
  {sc:"Babak 2", txt:"Ternyata Salsa memakai satu CV yang sama untuk semua lowongan dan tidak kenal siapa pun di perusahaan tujuannya. Langkah berikutnya?",
   o:[["Ajak 2 alumni ngobrol: minta cerita pekerjaan mereka dan masukan untuk CV.",100,"Ini percakapan prototipe. Murah, cepat, dan membuka relasi."],["Pakai template CV paling keren dari internet.",50,"Tampilan membantu, tapi isi dan relasi jauh lebih menentukan."],["Tambahkan pengalaman yang dilebih-lebihkan supaya menarik.",0,"Berisiko besar dan bisa merusak kepercayaan saat wawancara."]]},
  {sc:"Babak 3", txt:"Dari obrolan dengan alumni, Salsa mulai tertarik dengan dunia HR, tapi belum yakin cocok. Apa yang sebaiknya ia lakukan?",
   o:[["Jadi panitia rekrutmen anggota baru himpunan selama sebulan untuk mencicipi pekerjaan HR.",100,"Ini pengalaman prototipe: menguji karier dalam versi kecil."],["Langsung daftar S2 Psikologi supaya serius.",30,"Komitmen besar sebelum diuji itu mahal kalau ternyata tidak cocok."],["Lupakan saja, terlalu berisiko.",0,"Tanpa mencoba, Salsa tidak akan pernah tahu."]]},
  {sc:"Babak Final", txt:"Salsa menikmati pengalamannya dan kini punya 2 tawaran magang: HR di startup dan staf administrasi di bank. Sudah dua minggu ia bimbang dan terus membandingkan. Apa saranmu?",
   o:[["Pakai logika dan intuisi untuk memilih, lalu jalani sepenuhnya tanpa terus menoleh ke belakang.",100,"Inilah langkah ‘Let go & move on’. Pilihan yang baik dijalani sepenuh hati."],["Tunggu dulu, siapa tahu ada tawaran ketiga yang lebih baik.",30,"Menunda terus bisa membuat kedua kesempatan hilang."],["Terima dua-duanya diam-diam.",0,"Ini merusak kepercayaan dan reputasi Salsa sejak awal."]]},
];
const T_GRAV = 8, T_REF = 15; // detik
const STAGE_OF = {l1:1,l2:2,l3:3,l4:4,l5:5,boss:6};
const STAGE_NAME = {1:"Level 1",2:"Level 2",3:"Level 3",4:"Level 4",5:"Level 5",6:"Boss Level"};

// ---------------- STATE ----------------
let S = load() || fresh();
function fresh(){ return {step:"welcome", nama:"", nim:"", prodi:"", done:{}, pts:{}, dash:{Health:2,Work:2,Play:2,Love:2}, focus:"", l2:{i:0,score:0,order:null}, l3:{i:0,score:0,order:null}, work:[], life:[], own:"", plans:[{t:"",e:0},{t:"",e:0},{t:"",e:0}], boss:{i:0,score:0}, start:0, end:0, sent:false, rank:null, total:null, stage:0, char:""}; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const total = () => Object.values(S.pts).reduce((a,b)=>a+b,0);
function go(step){ S.step = step; save(); render(); window.scrollTo(0,0); }
function pop(txt){ const d=document.createElement("div"); d.className="pop"; d.textContent=txt; document.body.appendChild(d); setTimeout(()=>d.remove(),950); }
function header(){ return `<div class="top"><div class="brandwrap">${S.char&&!["welcome","pick"].includes(S.step)?`<span id="buddy"></span>`:""}<div class="brand">LIFE DESIGN QUEST</div></div>${S.step!=="welcome"?`<div class="pts">⭐ <b id="ptsv">${total()}</b> poin</div>`:""}</div>`; }
let timerId = null;
function stopTimer(){ if(timerId){ cancelAnimationFrame(timerId); timerId=null; } }

// ---------------- SCREENS ----------------
function render(){
  stopTimer();
  const app = $("#app");
  if(S.nama && !S.char && !["welcome","pick"].includes(S.step)) S.step="pick";
  const f = ({welcome,pick,map,l1,l2,l3,l4,l5,boss,result,cert})[S.step] || welcome;
  app.innerHTML = header() + `<div class="fade">${f()}</div>`;
  mountBuddy();
  const after = AFTER[S.step]; if(after) after();
}
const AFTER = {};

function dotsHTML(){
  const cs=[COL.coral,COL.sun,COL.teal,COL.blue,COL.purple,"#fff"]; let h=""; let seed=11;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=0;i<90;i++){ const a=rnd()*Math.PI*2, r=48+rnd()*26, s=4+rnd()*7; h+=`<span style="left:calc(50% + ${Math.cos(a)*r}px - ${s/2}px);top:${75+Math.sin(a)*r-s/2}px;width:${s}px;height:${s}px;background:${cs[Math.floor(rnd()*6)]};opacity:${.55+rnd()*.45}"></span>`; }
  return `<div class="dots">${h}<span style="left:calc(50% - 28px);top:47px;width:56px;height:56px;background:${COL.coral};display:grid;place-items:center;font-size:28px">🧭</span></div>`;
}

function welcome(){
  return `<div class="logo-wrap">${nnLogo(false,170)}</div>
  <h1>Rancang masa depanmu, level demi level.</h1>
  <p>6 tantangan singkat dari sesi <b>Your Future, Your Plan</b>. Kumpulkan poin, rebut puncak papan skor, dan bawa pulang sertifikat beserta roadmap kariermu.</p>
  <div class="card">
    <label for="nama">Nama lengkap (untuk sertifikat)</label>
    <input type="text" id="nama" maxlength="50" autocomplete="name" value="${esc(S.nama)}" placeholder="Contoh: Nadia Putri Lestari">
    <label for="nim">NIM</label>
    <input type="text" id="nim" maxlength="20" inputmode="numeric" value="${esc(S.nim)}" placeholder="Nomor Induk Mahasiswa">
    <label for="prodi">Program studi</label>
    <select id="prodi"><option value="">Pilih prodi</option>${["Akuntansi","Manajemen","Lainnya"].map(p=>`<option ${S.prodi===p?"selected":""}>${p}</option>`).join("")}</select>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Mulai petualangan →</button>
  </div>
  <p class="small">Poin didapat dari level kuis (2, 3, dan Boss): makin cepat dan tepat, makin besar. Level refleksi tidak ada jawaban benar-salah, cukup jujur dan selesaikan.</p>`;
}
AFTER.welcome = () => {
  $("#go").onclick = () => {
    const nama=$("#nama").value.trim().replace(/\s+/g," "), nim=$("#nim").value.trim().replace(/\s+/g,""), prodi=$("#prodi").value;
    if(nama.length<3) return $("#err").textContent="Isi nama lengkapmu dulu ya.";
    if(!/^[A-Za-z0-9.\-]{4,20}$/.test(nim)) return $("#err").textContent="NIM belum valid (minimal 4 karakter, tanpa spasi).";
    if(!prodi) return $("#err").textContent="Pilih program studimu.";
    S.nama=nama; S.nim=nim; S.prodi=prodi; if(!S.start) S.start=Date.now(); go(S.char?"map":"pick");
  };
};

// ---- karakter
let BUDDY=null, BUDDY_ID="", reactT=null;
function mountBuddy(){
  const b=$("#buddy"); if(!b||!S.char) return;
  if(!BUDDY||BUDDY_ID!==S.char){ BUDDY=LDQ_CHARS.animated(S.char,2,"idle"); BUDDY_ID=S.char; }
  b.appendChild(BUDDY);
}
function react(mode, ms){ if(!BUDDY) return; BUDDY.setMode(mode); clearTimeout(reactT); reactT=setTimeout(()=>BUDDY&&BUDDY.setMode("idle"), ms||1100); }

// ---- timed quiz helper
function runTimer(sec, onEnd){
  const bar=$("#tbar"); const t0=performance.now();
  const tick=(now)=>{ const left=Math.max(0,1-(now-t0)/(sec*1000)); if(bar) bar.style.width=(left*100)+"%"; if(bar) bar.style.background = left<.3?COL.coral:COL.sun;
    if(left<=0){ timerId=null; onEnd(); return; } timerId=requestAnimationFrame(tick); };
  timerId=requestAnimationFrame(tick);
  return ()=>Math.max(0,1-(performance.now()-t0)/(sec*1000));
}

function hashCode(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return (h>>>0).toString(36).toUpperCase().padStart(6,"0").slice(-6); }
const certCode = () => "LDQ-" + hashCode(S.nim+"|"+S.nama.toUpperCase());
function jsonp(url, cb, fail){
  const name="ldqcb"+Date.now()+Math.floor(Math.random()*1000); const s=document.createElement("script"); let done=false;
  window[name]=d=>{ done=true; cb(d); cleanup(); };
  const cleanup=()=>{ try{ delete window[name]; }catch(e){ window[name]=undefined; } s.remove(); };
  s.onerror=()=>{ if(!done){ fail&&fail(); cleanup(); } };
  setTimeout(()=>{ if(!done){ fail&&fail(); cleanup(); } },12000);
  s.src=url+(url.includes("?")?"&":"?")+"callback="+name; document.body.appendChild(s);
}
function submit(cb, final){
  if(!CFG.SCRIPT_URL){ cb&&cb(false); return; }
  const d={nama:S.nama,nim:S.nim,prodi:S.prodi,skor:total(),levels:Object.keys(S.done).length,durasi:Math.round(((S.end||Date.now())-S.start)/1000),kode:certCode(),kompas:kompasText(),planA:S.plans[0].t,planB:S.plans[1].t,planC:S.plans[2].t,dashboard:JSON.stringify(S.dash),fokus:S.focus,char:S.char||"m1"};
  jsonp(CFG.SCRIPT_URL+"?action=submit&d="+encodeURIComponent(JSON.stringify(d)), r=>{ if(r&&r.ok){ if(final!==false) S.sent=true; S.rank=r.rank; S.total=r.total; save(); } cb&&cb(!!(r&&r.ok)); }, ()=>cb&&cb(false));
}
function fmtDur(sec){ const m=Math.floor(sec/60), s=sec%60; return `${m} menit ${s} detik`; }
function result(){
  if(!S.end){ S.end=Date.now(); save(); }
  return `<span class="tag" style="background:${COL.sun}">QUEST SELESAI 🎉</span><div class="hero" id="hero"></div><h1 style="text-align:center">Selamat, ${esc(S.nama.split(" ")[0])}!</h1>
  <div class="card" style="text-align:center"><div class="small" style="color:var(--muted);font-weight:700">TOTAL POIN</div><div class="big">${total()}</div>
  <div id="rankbox" class="small" style="color:var(--muted);font-weight:700">${CFG.SCRIPT_URL?"Mengirim skor ke papan…":"Mode offline: skor tidak dikirim ke papan."}</div></div>
  <div class="card">${LEVELS.map(l=>`<div class="rowstat"><span>${l.ic} ${l.t}</span><span>+${S.pts[l.id]||0}</span></div>`).join("")}
  <div class="rowstat"><span>⏱️ Waktu</span><span>${fmtDur(Math.round((S.end-S.start)/1000))}</span></div></div>
  <button class="btn" id="go">Ambil sertifikatku 🏅</button>`;
}

  <button class="btn" id="dl" disabled>Simpan sertifikat</button>
  <button class="btn ghost" id="back">← Kembali ke hasil</button>
  <p class="small" style="margin-top:16px">Kode verifikasi: <b>${certCode()}</b>. Simpan baik-baik, ya.</p>`;
}
let CERT=null; // {key, blob, url} disimpan di memori agar tidak digambar ulang
AFTER.cert = async () => {
  $("#back").onclick=()=>go("result");
  const key=[S.nama,S.nim,total(),S.rank,S.char].join("|");
  if(!CERT||CERT.key!==key){
    const cv=await drawCert();
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.92));
    if(CERT) URL.revokeObjectURL(CERT.url);
    CERT={key, blob, url:URL.createObjectURL(blob)};
  }
  if(!$("#certimg")) return;
  $("#certimg").src=CERT.url; $("#certimg").style.display="block"; $("#certwait").remove();
  const fname=`Sertifikat_LDQ_${S.nim}.jpg`;
  $("#dl").disabled=false;
  $("#dl").onclick=async()=>{
    const file=new File([CERT.blob],fname,{type:"image/jpeg"});
    // HP: buka menu berbagi (Simpan Gambar / kirim WA). Laptop: unduh biasa.
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:"Sertifikat Life Design Quest"}); return; }catch(e){ if(e&&e.name==="AbortError") return; }
    }
    const a=document.createElement("a"); a.href=CERT.url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  };
};
function wrap(ctx, text, x, y, maxW, lh, maxLines){
  const words=text.split(" "); let line="", lines=[];
  for(const w of words){ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line);
  if(maxLines && lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,"")+"…"; }
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh)); return lines.length;
}
function fitFont(ctx, text, weight, size, maxW, family){ let s=size; do{ ctx.font=`${weight} ${s}px ${family}`; s-=2; }while(ctx.measureText(text).width>maxW && s>20); }
async function drawCert(){
  // tunggu font maksimal 1,5 detik agar tidak macet di jaringan lambat
  try{ await Promise.race([Promise.all([document.fonts.load('800 40px "Plus Jakarta Sans"'),document.fonts.load('400 20px "Plus Jakarta Sans"')]), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  const F='"Plus Jakarta Sans", system-ui, sans-serif';
  const W=2000,H=1414, c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  // background
  x.fillStyle="#FFFFFF"; x.fillRect(0,0,W,H);
  x.fillStyle=COL.ink; x.fillRect(0,0,640,H);
  // dot ring
  let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;}; const cs=[COL.coral,COL.sun,COL.teal,COL.blue,COL.purple,"#FFFFFF"];
  for(let i=0;i<420;i++){ const a=rnd()*Math.PI*2, r=150+rnd()*95, s=4+rnd()*9; x.globalAlpha=.55+rnd()*.45; x.fillStyle=cs[Math.floor(rnd()*6)]; x.beginPath(); x.arc(320+Math.cos(a)*r,400+Math.sin(a)*r,s,0,7); x.fill(); }
  x.globalAlpha=1;
  x.fillStyle=COL.coral; x.beginPath(); x.arc(320,400,120,0,7); x.fill();
  x.imageSmoothingEnabled=false; const sp=LDQ_CHARS.canvasFor(S.char||"m1",3,9); x.drawImage(sp,320-sp.width/2,400-sp.height/2+6); x.imageSmoothingEnabled=true;
  x.textAlign="center";
  x.textBaseline="alphabetic";
  x.fillStyle=COL.sun; x.font=`800 30px ${F}`; x.fillText("CERTIFIED",320,760);
  x.fillStyle="#FFFFFF"; x.font=`800 50px ${F}`; x.fillText("Life Designer",320,822);
  x.fillStyle="#B8BDD6"; x.font=`400 26px ${F}`; x.fillText("Life Design Quest",320,868);
  // score box
  x.fillStyle=COL.ink2; roundRect(x,140,960,360,190,24); x.fill();
  x.fillStyle=COL.sun; x.font=`800 84px ${F}`; x.fillText(String(total()),320,1065);
  x.fillStyle="#B8BDD6"; x.font=`600 24px ${F}`; x.fillText("TOTAL POIN"+(S.rank?`  ·  PERINGKAT #${S.rank}`:""),320,1110);
  x.fillStyle="#8D93B5"; x.font=`600 22px ${F}`; x.fillText("Kode verifikasi: "+certCode(),320,1300);
  // right side
  x.textAlign="left"; const L=730, R=W-110, RW=R-L;
  x.fillStyle=COL.coral; x.font=`800 30px ${F}`; x.fillText("SERTIFIKAT PENYELESAIAN TANTANGAN",L,150);
  x.fillStyle=COL.muted; x.font=`400 30px ${F}`; x.fillText("Diberikan kepada",L,235);
  x.fillStyle=COL.ink; fitFont(x,S.nama,800,76,RW,F); x.fillText(S.nama,L,325);
  x.fillStyle=COL.muted; x.font=`600 30px ${F}`; x.fillText(`NIM ${S.nim}  ·  Program Studi ${S.prodi}`,L,380);
  x.fillStyle=COL.ink; x.font=`400 28px ${F}`;
  const ln = wrap(x,`telah menyelesaikan seluruh tantangan Life Design Quest dalam sesi “${CFG.SESSION}”, ${CFG.EVENT}, ${CFG.DATE}.`,L,450,RW,42,3);
  // roadmap box
  let y = 450 + ln*42 + 30;
  x.fillStyle=COL.light; roundRect(x,L,y,RW,520,24); x.fill();
  x.fillStyle=COL.blue; x.font=`800 24px ${F}`; x.fillText("MY PERSONAL CAREER ROADMAP",L+36,y+54);
  x.fillStyle=COL.ink; x.font=`italic 600 27px ${F}`;
  const kl = wrap(x,"“"+kompasText()+"”",L+36,y+102,RW-72,38,3);
  let py = y+102+kl*38+24; const pw=(RW-72-40)/3;
  [[COL.teal,"PLAN A"],[COL.sun,"PLAN B"],[COL.coral,"PLAN C"]].forEach(([cc,lab],i)=>{
    const px=L+36+i*(pw+20);
    x.fillStyle="#FFFFFF"; roundRect(x,px,py,pw,y+520-py-30,18); x.fill();
    x.fillStyle=cc; roundRect(x,px+20,py+20,120,40,20); x.fill();
    x.fillStyle=COL.ink; x.font=`800 20px ${F}`; x.textAlign="center"; x.fillText(lab,px+80,py+47); x.textAlign="left";
    x.font=`700 25px ${F}`; wrap(x,S.plans[i].t,px+20,py+100,pw-40,33,3);
    x.fillStyle=COL.sun; x.font=`400 24px ${F}`; x.fillText("★".repeat(S.plans[i].e),px+20,y+520-48);
    x.fillStyle="#D7DAE8"; x.fillText("★".repeat(5-S.plans[i].e),px+20+x.measureText("★".repeat(S.plans[i].e)).width,y+520-48);
    x.fillStyle=COL.ink;
  });
  // signature
  const sy=H-150;
  x.strokeStyle=COL.ink; x.lineWidth=2; x.beginPath(); x.moveTo(R-560,sy-50); x.lineTo(R,sy-50); x.stroke();
  x.fillStyle=COL.ink; x.font=`800 30px ${F}`; x.textAlign="right"; x.fillText(CFG.SPEAKER,R,sy);
  x.fillStyle=COL.muted; x.font=`400 26px ${F}`; x.fillText(CFG.SPEAKER_ROLE,R,sy+40);
  x.textAlign="left"; x.fillStyle=COL.muted; x.font=`400 22px ${F}`; x.fillText(new Date(S.end||Date.now()).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}),L,sy+40);
  return c;
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

// Reset tersembunyi untuk narasumber/panitia: tambahkan ?reset=1 di URL
if(new URLSearchParams(location.search).get("reset")==="1"){ try{ localStorage.removeItem(KEY); }catch(e){} S=fresh(); history.replaceState(null,"",location.pathname); }
// ---- polling sesi dari narasumber
function pollStage(){
  if(!CFG.SCRIPT_URL || S.step!=="map") return;
  jsonp(CFG.SCRIPT_URL+"?action=stage", r=>{
    if(!r||!r.ok) return; const before=curStage(); S.stage=r.stage; save();
    if(r.stage!==before && S.step==="map"){ render(); if(r.stage>before){ pop("🔓 Terbuka!"); try{navigator.vibrate&&navigator.vibrate(200);}catch(e){} } }
  });
}
setInterval(pollStage, 4000);

// ---- layar pembuka (±5 detik)
function splash(ms){
  const sp=document.createElement("div"); sp.id="splash";
  sp.innerHTML=nnLogo(true)+'<div class="sp-term" id="spt"></div><div class="sp-title">LIFE DESIGN QUEST</div><div class="sp-sub">Your Future, Your Plan</div>';
  document.body.appendChild(sp);
  const cmd="$ ./life-design-quest --start", el=sp.querySelector("#spt"); let i=0;
  const typer=setInterval(()=>{ i++; el.innerHTML=esc(cmd.slice(0,i))+'<span class="cur"></span>'; if(i>=cmd.length) clearInterval(typer); }, Math.max(25,(ms*0.45)/cmd.length));
  setTimeout(()=>{ sp.querySelector(".sp-title").classList.add("sp-show"); sp.querySelector(".sp-sub").classList.add("sp-show"); }, ms*0.62);
  setTimeout(()=>{ sp.classList.add("out"); setTimeout(()=>sp.remove(),650); }, ms);
}
render();
splash(S.nama ? 2500 : 5000);
pollStage();
</script>
