<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Papan Skor · Life Design Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#141B34;--ink2:#232B52;--coral:#FF6B4A;--sun:#FFC94D;--teal:#2EC4B6;--blue:#4D7CFE;--purple:#9B5DE5;--muted:#B8BDD6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:#fff;font-family:"Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column;padding:3.5vh 4vw 3.5vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:1vw}
.brand{display:flex;align-items:center;gap:.8vw;min-width:0}
.brand .nn{width:clamp(30px,2.8vw,52px);height:clamp(30px,2.8vw,52px);flex:0 0 auto}
.brand .bt{font-weight:800;color:var(--sun);font-size:clamp(14px,1.25vw,24px);letter-spacing:.02em;line-height:1.15;white-space:nowrap}
.brand .bs{font-weight:600;color:var(--muted);font-size:clamp(10px,.78vw,15px);line-height:1.3;white-space:nowrap}
.tabs{display:flex;gap:.5vw;flex:0 0 auto}
.tabs button{font:inherit;font-weight:800;font-size:clamp(11px,.9vw,17px);white-space:nowrap;padding:.55vw 1.1vw;border-radius:99px;border:2px solid #3A4270;background:transparent;color:#fff;cursor:pointer}
.tabs button.on{background:var(--coral);border-color:var(--coral);color:var(--ink)}
#snd{width:clamp(28px,2.2vw,40px);height:clamp(28px,2.2vw,40px);flex:0 0 auto;display:grid;place-items:center;font-size:clamp(12px,1vw,18px);line-height:1;padding:0;border-radius:50%;border:1px solid #3A4270;background:transparent;color:#fff;cursor:pointer;opacity:.75}
#snd:hover{opacity:1}
#snd.on{border-color:var(--sun);opacity:1}
.view{flex:1;display:none;min-height:0}
.view.on{display:flex}
/* lobi */
#join{position:relative;margin:1.5vh -4vw 0;border-radius:0;overflow:hidden}
#lobbycv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;z-index:2}
.ov-l{left:2vw;bottom:2vh;display:flex;flex-direction:column;gap:1vh;align-items:flex-start}
.chip{background:rgba(20,27,52,.85);border-radius:99px;padding:.6vw 1.2vw;font-weight:800;font-size:1.2vw}
.chip b{color:var(--sun)}
.chip.stage{color:var(--teal)}
.qrcard{right:2vw;bottom:2vh;background:#fff;border-radius:1.4vw;padding:1.2vw;display:flex;align-items:center;justify-content:center;box-shadow:0 1vw 3vw rgba(0,0,0,.35)}
#qr{display:flex;align-items:center;justify-content:center;line-height:0}
#qr img,#qr canvas{width:13vw!important;height:13vw!important;display:block;margin:0 auto}
.qrcard .u{font-weight:800;font-size:.95vw;margin-top:.6vw}
.qrcard .t{font-weight:800;font-size:1.1vw;color:var(--coral)}
.av{width:2.6vw;height:3.9vw;image-rendering:pixelated;flex:0 0 auto}
.pod .hero{height:15vh;image-rendering:pixelated;display:block;margin:0 auto 1vh}
/* board */
#board{flex-direction:column;padding-top:2vh}
#board h2{font-size:2.6vw;margin:0 0 2vh;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);gap:1.2vh 2vw;flex:1;align-content:start}
.row{display:flex;align-items:center;gap:1.2vw;background:var(--ink2);border-radius:1.2vw;padding:1.3vh 1.4vw}
.rk{width:3.6vw;height:3.6vw;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.6vw;color:var(--ink);background:#3A4270;flex:0 0 auto}
.r1 .rk{background:var(--sun)}.r2 .rk{background:#D7DAE8}.r3 .rk{background:#E8A27C}
.nm{font-weight:800;font-size:1.65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font-size:1.05vw;color:var(--muted);font-weight:600}
.lv{display:inline-block;margin-left:.5vw;padding:.1vw .6vw;border-radius:99px;background:#3A4270;color:#fff;font-size:.95vw;font-weight:800}
.lv.done{background:var(--teal);color:var(--ink)}
.sc{margin-left:auto;font-weight:800;font-size:2vw;color:var(--sun)}
.empty{font-size:1.8vw;color:var(--muted)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:1.05vw;margin-top:1.5vh}
.prog{height:1vh;background:var(--ink2);border-radius:1vh;overflow:hidden;margin-top:1vh}
.prog i{display:block;height:100%;background:var(--teal);transition:width .6s}
/* podium */
#podium{flex-direction:column;align-items:center;justify-content:flex-end;position:relative}
#podium h2{font-size:3.4vw;margin:0 0 4vh;font-weight:800;text-align:center}
.pods{display:flex;align-items:flex-end;gap:2vw}
.pod{width:22vw;text-align:center;opacity:0;transform:translateY(6vh);transition:all .8s cubic-bezier(.2,.9,.3,1.2)}
.pod.show{opacity:1;transform:none}
.pod .who{font-weight:800;font-size:2vw;margin-bottom:.5vh;padding:0 .5vw}
.pod .ps{color:var(--muted);font-size:1.2vw;margin-bottom:1.5vh}
.pod .blk{border-radius:1.5vw 1.5vw 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2vh;color:var(--ink)}
.pod .blk .n{font-size:6vw;font-weight:800;line-height:1}
.pod .blk .s{font-size:1.8vw;font-weight:800}
#reveal{font:inherit;font-weight:800;font-size:1.4vw;padding:1vw 2.2vw;border-radius:99px;border:0;background:var(--coral);color:var(--ink);cursor:pointer;margin-top:3vh}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:5}
.warn{background:#5A2330;color:#FFD6D8;padding:1vw 1.4vw;border-radius:1vw;font-size:1.2vw;margin-top:2vh}
/* kontrol narasumber */
.ctl{display:flex;align-items:center;gap:.35vw;background:var(--ink2);border:1px solid #3A4270;padding:.35vw .5vw;border-radius:99px;margin-left:auto;flex:0 0 auto}
.ctl span{white-space:nowrap;font-size:clamp(9px,.72vw,14px);font-weight:700;color:var(--muted);margin:0 .3vw}
.ctl button{font:inherit;font-weight:800;font-size:clamp(10px,.82vw,15px);min-width:clamp(22px,2vw,36px);padding:.3vw .55vw;border-radius:99px;border:1px solid #4A5280;background:transparent;color:#fff;cursor:pointer}
.ctl button.on{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);background:var(--teal);color:var(--ink);font-weight:800;font-size:1.4vw;padding:1vw 2vw;border-radius:99px;z-index:7;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast.bad{background:var(--coral)}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand"><span id="mini"></span><div><div class="bt">Life Design Quest</div><div class="bs">Your Future, Your Plan: Building Your Personal Career Roadmap</div></div></div>
    <div class="ctl" id="ctl" title="Klik angka untuk membuka level sampai nomor itu; klik gembok untuk mengunci semua">
      <span>BUKA LEVEL</span>
      <button data-s="0" title="Kunci semua">🔒</button>
      <button data-s="1">1</button><button data-s="2">2</button><button data-s="3">3</button><button data-s="4">4</button><button data-s="5">5</button><button data-s="6">6</button>
    </div>
    <button id="snd" title="Musik on/off (tombol M)" aria-label="Musik on/off">🔇</button>
    <div class="tabs">
      <button data-v="join" class="on">1 · Lobi</button>
      <button data-v="board">2 · Papan Skor</button>
      <button data-v="podium">3 · Juara 🏆</button>
    </div>
  </div>

  <section class="view on" id="join">
    <canvas id="lobbycv"></canvas>
    <div class="ov ov-l">
      <span class="chip stage" id="stageNow">Menunggu Sesi 1 dibuka</span>
      <span class="chip">Di kampus: <b id="cnt1">0</b> · Tamat: <b id="cnt1b">0</b></span>
      <div id="warn"></div>
    </div>
    <div class="ov qrcard"><div id="qr" title="Scan untuk masuk"></div><div id="url" hidden></div></div>
  </section>

  <section class="view" id="board">
    <h2>🔥 10 Life Designer Teratas</h2>
    <div class="grid" id="grid"><div class="empty">Menunggu peserta pertama menyelesaikan sesi…</div></div>
    <div class="prog"><i id="pbar" style="width:0%"></i></div>
    <div class="foot"><span id="cnt2">0 peserta bermain</span><span id="upd">Memperbarui otomatis setiap 5 detik</span></div>
  </section>

  <section class="view" id="podium">
    <h2>Selamat kepada para juara! 🎉</h2>
    <div class="pods" id="pods"></div>
    <button id="reveal">Umumkan juara</button>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="logo.js"></script>
<script src="chars.js"></script>
<script src="lobby.js"></script>
<script src="sound.js"></script>
<script src="config.js"></script>
<script>
const CFG = Object.assign({SCRIPT_URL:""}, window.LDQ_CONFIG||{});
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qp = new URLSearchParams(location.search);
const GAME = qp.get("game") || location.href.split("?")[0].split("#")[0].replace(/leaderboard\.html$/,"");
const STAGE_TXT = {0:"🔒 Semua level terkunci",1:"🔓 Level 1 dibuka",2:"🔓 Level 1–2 dibuka",3:"🔓 Level 1–3 dibuka",4:"🔓 Level 1–4 dibuka",5:"🔓 Level 1–5 dibuka",6:"🔓 Semua level dibuka"};
let DATA = {top:[],total:0,finished:0,stage:0};

$("#mini").innerHTML = nnLogo(false);
startLobby($("#lobbycv"), ()=>DATA.players||[]);

// tabs (+ pintasan keyboard 1/2/3)
let REVEALED=false;
const trackFor = v => v==="join"?"lobby":v==="board"?"board":(REVEALED?"victory":"suspense");
function show(v){ LDQ_SOUND.setTrack(trackFor(v)); document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v)); document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v)); }
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.v));
addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="1")show("join"); if(e.key==="2")show("board"); if(e.key==="3")show("podium"); if(e.key==="m"||e.key==="M") $("#snd").click(); });
$("#snd").onclick=()=>{ const on=LDQ_SOUND.toggle(); $("#snd").classList.toggle("on",on); $("#snd").textContent=on?"🔊":"🔇"; };

// QR
$("#url").textContent = GAME.replace(/^https?:\/\//,"");
try{ new QRCode($("#qr"),{text:GAME,width:400,height:400,colorDark:"#141B34",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
catch(e){ const im=new Image(); im.alt="QR ke game"; im.src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data="+encodeURIComponent(GAME); $("#qr").appendChild(im); }
if(!CFG.SCRIPT_URL) $("#warn").innerHTML='<div class="warn">SCRIPT_URL di config.js belum diisi, jadi papan skor belum terhubung ke Google Sheets.</div>';

// data
let jn=0;
function jsonp(url, cb, fail){
  const name="lbcb"+Date.now()+"_"+(jn++); const s=document.createElement("script"); let done=false;
  window[name]=d=>{ done=true; cb(d); s.remove(); delete window[name]; };
  s.onerror=()=>{ if(!done){ done=true; fail&&fail(); s.remove(); } };
  setTimeout(()=>{ if(!done){ done=true; fail&&fail(); s.remove(); } },10000);
  s.src=url+(url.includes("?")?"&":"?")+"callback="+name; document.body.appendChild(s);
}
const short = n => { const p=String(n).trim().split(/\s+/); return p.length>2? p.slice(0,2).join(" ")+" "+p[2][0]+"." : p.join(" "); };
function paintStage(st){
  $("#stageNow").textContent = STAGE_TXT[st]||STAGE_TXT[0];
  document.querySelectorAll(".ctl button").forEach(b=>{ const n=+b.dataset.s; b.classList.toggle("on", st===0 ? n===0 : (n>0 && n<=st)); });
}
function paint(){
  const t=DATA.top||[];
  $("#cnt1").textContent=DATA.total; $("#cnt1b").textContent=DATA.finished||0;
  $("#cnt2").textContent=`${DATA.total} peserta bermain · ${DATA.finished||0} sudah tamat`;
  $("#pbar").style.width=(DATA.total?Math.min(100,(DATA.finished||0)/DATA.total*100):0)+"%";
  $("#grid").innerHTML = t.length ? t.map((r,i)=>`<div class="row r${i+1}" style="grid-column:${i<5?1:2};grid-row:${(i%5)+1}"><div class="rk">${i+1}</div><img class="av" alt="" src="${LDQ_CHARS.dataURL(r.char||"m1",0,4)}"><div style="min-width:0"><div class="nm">${esc(short(r.nama))}</div><div class="pr">${esc(r.prodi)}<span class="lv ${r.levels>=6?"done":""}">${r.levels>=6?"TAMAT":"Lv "+r.levels+"/6"}</span></div></div><div class="sc">${r.skor}</div></div>`).join("") : '<div class="empty">Menunggu peserta pertama menyelesaikan sesi…</div>';
  paintStage(DATA.stage||0);
}
let POLLED=false;
function poll(){
  if(!CFG.SCRIPT_URL) return;
  jsonp(CFG.SCRIPT_URL+"?action=top", d=>{ if(d&&d.ok){ const prevTotal=DATA.total, prevTop=(DATA.top&&DATA.top[0]||{}).nama; DATA=d; paint(); if(POLLED){ if(d.total>prevTotal) LDQ_SOUND.pop(); else if(d.top&&d.top[0]&&d.top[0].nama!==prevTop) LDQ_SOUND.ding(); } POLLED=true; if(!("players" in d)) $("#warn").innerHTML='<div class="warn">Skrip Google masih versi lama: tempel Code.gs terbaru lalu Deploy &gt; Manage deployments &gt; New version.</div>'; else if($("#warn").textContent.includes("versi lama")) $("#warn").innerHTML=""; $("#upd").textContent="Diperbarui "+new Date().toLocaleTimeString("id-ID"); } }, ()=>{ $("#upd").textContent="Koneksi terputus, mencoba lagi…"; });
}
poll(); setInterval(poll,5000);

// kontrol sesi narasumber
function toast(msg,bad){ const t=$("#toast"); t.textContent=msg; t.className="toast show"+(bad?" bad":""); clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",2600); }
document.querySelectorAll(".ctl button").forEach(b=>b.onclick=()=>{
  if(!CFG.SCRIPT_URL) return toast("SCRIPT_URL belum diisi",true);
  const st=+b.dataset.s;
  paintStage(st); // langsung terlihat, lalu dikonfirmasi server
  jsonp(CFG.SCRIPT_URL+"?action=setStage&stage="+st, r=>{
    if(r&&r.ok&&r.stage===st){ DATA.stage=r.stage; paintStage(r.stage); toast(STAGE_TXT[r.stage]); }
    else { paintStage(DATA.stage||0); toast(r&&r.ok?"Skrip Google belum versi terbaru (maks. 6 level)":((r&&r.error)||"Gagal mengubah level"),true); }
  }, ()=>toast("Koneksi gagal, coba lagi",true));
});

// podium
$("#reveal").onclick=()=>{
  const t=(DATA.top||[]).slice(0,3); if(!t.length){ $("#pods").innerHTML='<div class="empty">Belum ada peserta.</div>'; return; }
  const order=[1,0,2], h=["38vh","28vh","20vh"], c=["#FFC94D","#D7DAE8","#E8A27C"];
  $("#pods").innerHTML = order.filter(i=>t[i]).map(i=>`<div class="pod" data-i="${i}"><img class="hero" alt="" src="${LDQ_CHARS.dataURL(t[i].char||"m1",3,8)}"><div class="who">${esc(short(t[i].nama))}</div><div class="ps">${esc(t[i].prodi)}</div><div class="blk" style="height:${h[i]};background:${c[i]}"><div class="n">${i+1}</div><div class="s">${t[i].skor} poin</div></div></div>`).join("");
  $("#reveal").style.display="none";
  LDQ_SOUND.setTrack("none"); LDQ_SOUND.drumroll(3.15);
  [2,1,0].forEach((i,k)=>setTimeout(()=>{ const p=document.querySelector(`.pod[data-i="${i}"]`); if(p) p.classList.add("show"); if(i===0){ confetti(); LDQ_SOUND.fanfare(); LDQ_SOUND.applause(8); REVEALED=true; setTimeout(()=>{ if($("#podium").classList.contains("on")) LDQ_SOUND.setTrack("victory"); },5000); } else LDQ_SOUND.ding(); },600+k*1300));
};
function confetti(){
  const cv=$("#cf"), x=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cs=["#FF6B4A","#FFC94D","#2EC4B6","#4D7CFE","#9B5DE5","#fff"];
  const P=Array.from({length:260},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,s:6+Math.random()*8,v:2+Math.random()*4,r:Math.random()*6,dr:(Math.random()-.5)*.2,dx:(Math.random()-.5)*2,c:cs[Math.floor(Math.random()*6)]}));
  let t=0; (function f(){ x.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{ p.y+=p.v; p.x+=p.dx; p.r+=p.dr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if(++t<420) requestAnimationFrame(f); else x.clearRect(0,0,cv.width,cv.height); })();
}
</script>
</body>
</html>
